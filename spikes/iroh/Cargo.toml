[workspace]
resolver = "3"

[package]
name = "howl-iroh-spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
libc = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints.rust]
unsafe_code = "forbid"
