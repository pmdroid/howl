[package]
name = "howl-envelope"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Authenticated Howl wire envelopes"
publish = false

[dependencies]
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
curve25519-dalek = "4.1.3"
ed25519-dalek = "2.2.0"
rand_chacha = "0.9.0"
hkdf = "0.12.4"
hpke = { version = "0.13.0", default-features = false, features = ["alloc", "x25519"] }
rand_core = { version = "0.9.3", features = ["os_rng"] }
sha2 = "0.10.9"
subtle = "2.6.1"
zeroize = "1.8.2"

[dev-dependencies]
hex = "0.4.3"
serde_json = "1.0"

[lints]
workspace = true
