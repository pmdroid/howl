[package]
name = "howl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Local-first collaboration for humans and agents"
publish = false

[lints]
workspace = true

[dependencies]
agent-client-protocol = { version = "=5.6.1", features = ["unstable_protocol_v2"] }
base64 = "0.22"
curve25519-dalek = "5"
ed25519-dalek = "3"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.4"
hex = "0.4"
howl-envelope = { path = "../envelope" }
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
iroh-base = { version = "=1.5.0", default-features = false, features = ["key"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
x25519-dalek = { version = "3", features = ["static_secrets"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tempfile = "=3.27.0"
thiserror = "2"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
exacl = "0.13"
