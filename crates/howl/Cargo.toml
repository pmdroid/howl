[package]
name = "howl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Local-first collaboration for humans and agents"
publish = false

[lints]
workspace = true

[dependencies]
curve25519-dalek = "5"
ed25519-dalek = "3"
getrandom = "0.4"
hex = "0.4"
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
iroh-base = { version = "=1.5.0", default-features = false, features = ["key"] }
rustix = { version = "1", features = ["fs", "process"] }
sha2 = "0.11"
x25519-dalek = { version = "3", features = ["static_secrets"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
exacl = "0.13"
