[package]
name = "howl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Local-first collaboration for humans and agents"
publish = false

[lints]
workspace = true

[dependencies]
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
agent-client-protocol = { version = "=5.6.1", features = ["unstable_protocol_v2"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
crossterm = { version = "=0.29.0", default-features = false, features = ["bracketed-paste", "event-stream", "events"] }
curve25519-dalek = "5"
ed25519-dalek = "3"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.4"
hex = "0.4"
hmac = "0.12"
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
howl-envelope = { path = "../envelope" }
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
iroh-base = { version = "=1.5.0", default-features = false, features = ["key"] }
rand_chacha = "0.9"
rand_core = { version = "0.9", features = ["os_rng"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
rmcp = { version = "=3.11.0", features = ["transport-streamable-http-server"] }
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sha2_10 = { package = "sha2", version = "0.10" }
subtle = "2.6"
x25519-dalek = { version = "3", features = ["static_secrets"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tempfile = "=3.27.0"
thiserror = "2"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
exacl = "0.13"
