services:
  postgres:
    image: docker.io/library/postgres:17.12-bookworm@sha256:1eff563f6c868b9b433566e9f3cf6e5c79fbd3b95bf70ec7277d376cdbfc50d7
    environment:
      POSTGRES_DB: howl
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-admin
      POSTGRES_INITDB_ARGS: --auth-local=trust --auth-host=scram-sha-256
    secrets:
      - postgres-admin
    ports:
      - "127.0.0.1:${HOWL_BETA_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=howl"]
      interval: 2s
      timeout: 2s
      retries: 30

secrets:
  postgres-admin:
    file: ${HOWL_BETA_PRIVATE_DIR:?set HOWL_BETA_PRIVATE_DIR}/postgres-admin

volumes:
  postgres-data:
